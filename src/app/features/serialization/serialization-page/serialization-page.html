<nav class="progress-rail" aria-label="Section progress">
  <ol>
    @for (item of progress; track item.id; let i = $index) {
      <li>
        <button
          type="button"
          class="progress-dot"
          [class.is-active]="activeSection() === item.id"
          (click)="scrollTo(item.id)"
          [attr.aria-current]="activeSection() === item.id ? 'true' : null"
        >
          <span class="progress-index mono">{{ (i + 1).toString().padStart(2, '0') }}</span>
          <span class="progress-label">{{ item.label }}</span>
        </button>
      </li>
    }
  </ol>
</nav>
